<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Κράτηση - Grand Kavala Hotel</title>
  <link rel="stylesheet" href="../css/booking.css">
  <style>.site{display:none}</style>
  <script type="module" src="../js/supabase-config.js"></script>
  <script src="../js/booking.js" defer></script>
</head>
<body>
  <div id="app-loader" class="app-loader">
    <div class="loader-box">
      <div class="loader-logo">Grand Kavala</div>
      <div class="loader-sub">Σύστημα Κρατήσεων</div>
      <div class="loader-spin"><i class="ti ti-loader"></i></div>
      <div class="loader-msg">Φόρτωση...</div>
    </div>
  </div>
  <div class="site">
    <nav>
      <div class="logo">Grand Kavala<span>Hotel & Suites</span></div>
      <a href="../index.html" class="nav-cta" style="text-decoration: none; display: inline-block;">← Επιστροφή</a>
    </nav>

    <div class="booking-container">
      <div class="booking-card">
        <div class="card-head">
          <div class="card-head-title" id="form-title">Ολοκλήρωση Κράτησης</div>
        </div>
        <div class="card-body" id="form-body">
          </div>
        <div class="card-footer" id="form-footer">
          </div>
      </div>
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>
</body>
</html>
