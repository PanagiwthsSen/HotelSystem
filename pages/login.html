<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σύνδεση - Grand Kavala</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="/css/login.css">
    <style>.login-container{display:none}</style>
</head>
<body>

    <div id="app-loader" class="app-loader">
      <div class="loader-box">
        <div class="loader-logo">Grand Kavala</div>
        <div class="loader-sub">Σύστημα Διαχείρισης</div>
        <div class="loader-spin"><i class="ti ti-loader"></i></div>
        <div class="loader-msg">Φόρτωση...</div>
      </div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h1>Grand Kavala</h1>
            <p>Σύστημα Διαχείρισης Ξενοδοχείου</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Όνομα Χρήστη</label>
                <input type="text" id="username" placeholder="π.χ. admin" required>
            </div>
            
            <div class="form-group">
                <label for="password">Κωδικός Πρόσβασης</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Είσοδος</button>
        </form>
    </div>

    <div id="error-message">Λάθος όνομα χρήστη ή κωδικός!</div>

    <script type="module" src="../js/supabase-config.js"></script>
    <script type="module" src="../js/login.js"></script>
</body>
</html>
